# HS Copy Center - Nginx Configuration for Next.js
# File: /etc/nginx/sites-available/hscopycenter

upstream nextjs_hscopycenter {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 8081;
    server_name localhost;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js static files (served from /_next/static/)
    location /_next/static/ {
        proxy_pass http://nextjs_hscopycenter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files
    location /images/ {
        proxy_pass http://nextjs_hscopycenter;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon and other static assets
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|otf)$ {
        proxy_pass http://nextjs_hscopycenter;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # All other requests proxy to Next.js
    location / {
        proxy_pass http://nextjs_hscopycenter;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Error pages (optional - Next.js handles these)
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /var/www/html;
        internal;
    }
}
